databases:
  - name: hourstack-db
    databaseName: hourstack
    user: hourstack
    plan: free

services:
  - type: web
    name: hourstack
    plan: free
    runtime: python
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt && alembic upgrade heads
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hourstack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://hourstack.onrender.com
      - key: FRONTEND_URL
        value: https://hourstack.onrender.com
      # --- Fill these in from your Lemon Squeezy dashboard ---
      - key: LEMONSQUEEZY_API_KEY
        value: your_api_key_here
      - key: LEMONSQUEEZY_STORE_ID
        value: your_store_id_here
      - key: LEMONSQUEEZY_VARIANT_ID
        value: your_variant_id_here
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        value: your_webhook_secret_here
      # --- Resend (preferred for Render — Gmail SMTP is blocked by Google on cloud IPs) ---
      - key: RESEND_API_KEY
        value: your_resend_api_key_here
      - key: RESEND_FROM
        value: HourStack <onboarding@resend.dev>
      # --- SMTP fallback (only used if RESEND_API_KEY is not set) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: your@gmail.com
      - key: SMTP_PASSWORD
        value: your-app-password
      - key: SMTP_FROM
        value: your@gmail.com
      # --- AI Chatbot (required for the in-app assistant) ---
      - key: OPENAI_API_KEY
        value: your_openai_api_key_here
      # Optional: set to gpt-4o for higher quality (costs more)
      # - key: OPENAI_CHAT_MODEL
      #   value: gpt-4o-mini
